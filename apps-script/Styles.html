<style>
    :root {
      color-scheme: light;
      --ink: #172033;
      --muted: #667085;
      --line: #d8dee8;
      --line-soft: #e4e7ec;
      --page: #f4f6f8;
      --surface: #ffffff;
      --surface-soft: #f2f4f7;
      --brand: #172033;
      --teal: #2dd4bf;
      --teal-dark: #0f766e;
      --blue-soft: #e7f8f5;
      --warning: #fef3c7;
      --danger: #b91c1c;
      --success: #166534;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --ink: #e6edf5;
      --muted: #94a3b8;
      --line: #2a3546;
      --line-soft: #263041;
      --page: #0e1420;
      --surface: #18212f;
      --surface-soft: #222c3c;
      --brand: #0a111d;
      --teal: #2dd4bf;
      --teal-dark: #5eead4;
      --blue-soft: #11233f;
      --warning: #3a2c08;
      --danger: #fca5a5;
      --success: #6ee7a8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      font-family: "Source Sans Pro", "Helvetica Neue", Helvetica, Arial, sans-serif;
      color: var(--ink);
      background: var(--page);
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      transition:
        background-color 180ms ease,
        color 180ms ease;
    }

    main {
      max-width: 1120px;
      margin: 0 auto;
      padding: 28px 24px 42px;
    }

    .brand-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin: 0 0 22px;
    }

    .brand-lockup {
      display: grid;
      gap: 8px;
      min-width: 0;
    }

    .se-brand-logo {
      display: block;
      width: 164px;
      max-width: 100%;
      height: auto;
    }

    .se-brand-logo.logo-dark {
      display: none;
    }

    :root[data-theme="dark"] .se-brand-logo.logo-light {
      display: none;
    }

    :root[data-theme="dark"] .se-brand-logo.logo-dark {
      display: block;
    }

    h1 {
      margin: 0;
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2rem, 4vw, 3.25rem);
      letter-spacing: 0;
      line-height: 1.04;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .version {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      box-shadow: 0 10px 24px rgb(16 24 40 / 8%);
      color: var(--ink);
      font-family: "Source Sans Pro", "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 0.9rem;
      font-weight: 800;
      white-space: nowrap;
    }

    .theme-toggle {
      min-width: 34px;
      width: 34px;
      min-height: 34px;
      height: 34px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      box-shadow: 0 10px 24px rgb(16 24 40 / 8%);
      color: var(--ink);
    }

    .theme-toggle:hover:not(:disabled) {
      border-color: #b9c2d0;
    }

    :root[data-theme="dark"] .version,
    :root[data-theme="dark"] .theme-toggle {
      box-shadow: 0 10px 24px rgb(0 0 0 / 35%);
    }

    :root[data-theme="dark"] .theme-toggle:hover:not(:disabled) {
      border-color: #3a4757;
    }

    .theme-toggle .icon-sun {
      display: none;
    }

    :root[data-theme="dark"] .theme-toggle .icon-moon {
      display: none;
    }

    :root[data-theme="dark"] .theme-toggle .icon-sun {
      display: block;
    }

    .command-band {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 16px;
      margin-top: 18px;
      padding: 16px;
      border-radius: 8px;
      background: var(--brand);
      box-shadow: 0 20px 48px rgb(16 24 40 / 16%);
      color: #d0d5dd;
    }

    :root[data-theme="dark"] .command-band,
    :root[data-theme="dark"] .workspace {
      box-shadow: 0 18px 45px rgb(0 0 0 / 45%);
    }

    .command-band > div,
    .workspace-header > div,
    .notes article {
      min-width: 0;
    }

    .command-band strong {
      display: block;
      margin-bottom: 3px;
      color: #fef08a;
      font-size: 0.94rem;
    }

    .command-band span {
      color: #d0d5dd;
      font-size: 0.95rem;
      font-weight: 700;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .experimental {
      margin-top: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: 0 10px 24px rgb(16 24 40 / 7%);
      overflow: hidden;
    }

    :root[data-theme="dark"] .experimental {
      box-shadow: 0 10px 24px rgb(0 0 0 / 30%);
    }

    .experimental-title {
      padding: 14px 16px;
    }

    .experimental-body {
      display: grid;
      gap: 12px;
      padding: 0 16px 16px;
      border-top: 1px solid var(--line-soft);
    }

    .experimental-body p {
      padding-top: 14px;
      color: var(--muted);
      font-size: 0.94rem;
      font-weight: 700;
      line-height: 1.45;
    }

    .google-sheet-form {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
    }

    .google-sheet-field {
      width: 100%;
      min-height: 42px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--surface-soft);
      color: var(--ink);
      font: inherit;
      font-weight: 700;
      outline: none;
      transition:
        border-color 160ms ease,
        box-shadow 160ms ease;
    }

    .google-sheet-field:focus {
      border-color: var(--teal-dark);
      box-shadow: 0 0 0 3px rgb(45 212 191 / 18%);
    }

    .google-sheet-field::placeholder {
      color: var(--muted);
    }

    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-width: 170px;
      min-height: 42px;
      border: 0;
      border-radius: 7px;
      background: var(--teal);
      color: #09201f;
      font-size: 0.98rem;
      font-weight: 800;
      cursor: pointer;
      transition:
        background-color 160ms ease,
        color 160ms ease,
        transform 160ms ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
    }

    button:disabled {
      background: #94a3b8;
      color: #334155;
      cursor: not-allowed;
    }

    :root[data-theme="dark"] button:disabled {
      background: #475569;
      color: #cbd5e1;
    }

    .workspace {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: 0 18px 45px rgb(16 24 40 / 10%);
    }

    .workspace-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 18px;
      border-bottom: 1px solid var(--line-soft);
    }

    h2,
    p {
      margin: 0;
    }

    h2 {
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.45rem;
      letter-spacing: 0;
    }

    .workspace-header p {
      margin-top: 5px;
      color: var(--muted);
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .file-list {
      display: grid;
    }

    .upload-panel {
      padding: 18px;
      background: var(--surface);
    }

    .dropzone {
      display: grid;
      place-items: center;
      gap: 8px;
      min-height: 154px;
      padding: 24px;
      border: 1px dashed #94a3b8;
      border-radius: 8px;
      background: var(--surface-soft);
      color: var(--muted);
      cursor: pointer;
      text-align: center;
      transition:
        background-color 160ms ease,
        border-color 160ms ease,
        color 160ms ease,
        transform 160ms ease;
    }

    .dropzone:hover,
    .dropzone:focus-visible,
    .dropzone[data-dragging="true"] {
      border-color: var(--teal-dark);
      color: var(--ink);
      outline: none;
      transform: translateY(-1px);
    }

    .dropzone[data-dragging="true"] {
      background: var(--blue-soft);
    }

    .dropzone strong {
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.12rem;
      letter-spacing: 0;
    }

    .dropzone span {
      font-size: 0.86rem;
      font-weight: 700;
    }

    .dropzone .source-name {
      max-width: 100%;
      color: var(--ink);
      font-style: normal;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .dropzone[data-has-file="false"] .source-name {
      display: none;
    }

    .dropzone-icon {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      color: var(--ink);
      box-shadow: 0 10px 24px rgb(16 24 40 / 8%);
    }

    .browse-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      color: var(--ink);
      font-size: 0.9rem;
      font-weight: 800;
      box-shadow: 0 10px 24px rgb(16 24 40 / 6%);
    }

    :root[data-theme="dark"] .dropzone {
      background: #0a111d;
      border-color: #334155;
    }

    :root[data-theme="dark"] .dropzone[data-dragging="true"] {
      background: #0c3b34;
    }

    :root[data-theme="dark"] .dropzone-icon,
    :root[data-theme="dark"] .browse-pill {
      box-shadow: 0 10px 24px rgb(0 0 0 / 35%);
    }

    .row {
      display: grid;
      grid-template-columns: 220px minmax(220px, 1fr) 190px;
      min-height: 92px;
      background: var(--surface);
    }

    .row + .row {
      border-top: 1px solid var(--line-soft);
    }

    .label {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
      padding: 14px 16px;
      background: #ddebf7;
      font-weight: 800;
    }

    :root[data-theme="dark"] .label {
      background: #11233f;
    }

    .label small {
      display: block;
      color: #475467;
      font-size: 0.82rem;
      font-weight: 700;
      line-height: 1.25;
    }

    :root[data-theme="dark"] .label small {
      color: #b6c2d1;
    }

    .value {
      display: flex;
      align-items: center;
      min-width: 0;
      padding: 14px 16px;
      background: var(--warning);
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .action {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      background: var(--surface-soft);
    }

    input[type="file"] {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      clip-path: inset(50%);
    }

    .file-picker {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      min-width: 120px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--surface);
      color: var(--ink);
      font-size: 0.9rem;
      font-weight: 800;
      cursor: pointer;
      transition:
        border-color 160ms ease,
        transform 160ms ease;
    }

    .file-picker:hover {
      border-color: #b9c2d0;
      transform: translateY(-1px);
    }

    :root[data-theme="dark"] .file-picker:hover {
      border-color: #3a4757;
    }

    #status {
      min-height: 54px;
      margin: 18px 0 0;
      padding: 15px 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: 0 10px 24px rgb(16 24 40 / 6%);
      color: var(--muted);
      font-weight: 800;
    }

    :root[data-theme="dark"] #status,
    :root[data-theme="dark"] .notes article {
      box-shadow: 0 10px 24px rgb(0 0 0 / 30%);
    }

    #status[data-type="busy"] {
      border-color: var(--teal-dark);
      color: var(--teal-dark);
    }

    #status[data-type="success"] {
      border-color: var(--success);
      color: var(--success);
    }

    #status[data-type="error"] {
      border-color: var(--danger);
      color: var(--danger);
    }

    .notes {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-top: 18px;
    }

    .notes article {
      min-height: 76px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: 0 10px 24px rgb(16 24 40 / 7%);
      color: var(--muted);
      font-weight: 700;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .notes strong {
      display: block;
      margin-bottom: 3px;
      color: var(--ink);
      font-weight: 800;
    }

    footer {
      margin-top: 28px;
      color: var(--muted);
      line-height: 1.5;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
    }

    footer a {
      color: var(--ink);
      font-weight: 800;
    }

    @media (max-width: 820px) {
      main {
        padding: 20px 14px 36px;
      }

      .brand-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .header-actions {
        align-self: stretch;
        justify-content: space-between;
      }

      .brand-lockup {
        gap: 12px;
      }

      .command-band,
      .google-sheet-form,
      .row,
      .notes {
        grid-template-columns: 1fr;
      }

      .action {
        justify-content: start;
      }

      button {
        width: 100%;
      }

      .workspace-header {
        align-items: flex-start;
        flex-direction: column;
      }
    }

    /* ---- Tabs + History (Apps Script version) ---- */
    .tabs {
      display: flex;
      gap: 6px;
      margin: 0 0 18px;
      padding: 5px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      box-shadow: 0 10px 24px rgb(16 24 40 / 7%);
      width: fit-content;
      max-width: 100%;
      overflow-x: auto;
    }

    :root[data-theme="dark"] .tabs {
      box-shadow: 0 10px 24px rgb(0 0 0 / 30%);
    }

    .tab {
      min-width: 0;
      min-height: 36px;
      padding: 0 20px;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      font-size: 0.95rem;
      font-weight: 800;
      white-space: nowrap;
    }

    .tab[aria-selected="true"] {
      background: var(--teal);
      color: #09201f;
    }

    .tab:hover:not([aria-selected="true"]) {
      color: var(--ink);
      transform: none;
    }

    .panel[hidden] { display: none; }

    .history-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      padding: 18px;
      border-bottom: 1px solid var(--line-soft);
    }

    .history-controls label {
      color: var(--muted);
      font-size: 0.86rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .history-controls select,
    .history-controls input {
      min-height: 42px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--surface-soft);
      color: var(--ink);
      font: inherit;
      font-weight: 700;
      outline: none;
    }

    .history-controls input[type="search"] { flex: 1 1 240px; min-width: 0; }

    .history-controls select:focus,
    .history-controls input:focus {
      border-color: var(--teal-dark);
      box-shadow: 0 0 0 3px rgb(45 212 191 / 18%);
    }

    .range-custom { display: none; gap: 10px; align-items: center; }
    .range-custom[data-visible="true"] { display: flex; flex-wrap: wrap; }

    .history-table-wrap { overflow-x: auto; }

    table.history {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.94rem;
    }

    table.history th,
    table.history td {
      padding: 12px 18px;
      text-align: left;
      border-bottom: 1px solid var(--line-soft);
      vertical-align: middle;
      white-space: nowrap;
    }

    table.history th {
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      background: var(--surface-soft);
    }

    table.history td.file-cell {
      white-space: normal;
      font-weight: 700;
      min-width: 260px;
    }

    table.history tbody tr:hover { background: var(--surface-soft); }

    .pill {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 900;
      letter-spacing: 0.03em;
    }

    .pill-3pp { background: var(--blue-soft); color: var(--teal-dark); }
    .pill-update { background: var(--warning); color: #92400e; }
    :root[data-theme="dark"] .pill-update { color: #fcd34d; }

    .history-empty {
      padding: 36px 18px;
      text-align: center;
      color: var(--muted);
      font-weight: 700;
    }

    .history-count {
      padding: 12px 18px;
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 700;
      border-top: 1px solid var(--line-soft);
    }

    .link-open { color: var(--teal-dark); font-weight: 800; text-decoration: none; }
    .link-open:hover { text-decoration: underline; }

    #sync-status {
      margin-top: 10px;
      padding: 12px 16px;
      border-radius: 8px;
      background: var(--surface);
      border: 1px solid var(--line);
      color: var(--muted);
      font-weight: 700;
      font-size: 0.94rem;
    }

    #sync-status[hidden] { display: none; }
    #sync-status[data-type="busy"] { border-color: var(--teal-dark); color: var(--ink); }
    #sync-status[data-type="error"] { color: var(--danger); border-color: var(--danger); }
    #sync-status[data-type="success"] { color: var(--success); border-color: var(--teal-dark); }


    /* triple-clicking the pill shouldn't smear a text selection over it */
    .version {
      user-select: none;
      -webkit-user-select: none;
      cursor: default;
    }

    #admin-link {
      margin: 0 0 14px;
      padding: 12px 16px;
      border: 1px solid var(--teal-dark);
      border-radius: 8px;
      background: var(--surface);
      color: var(--ink);
      font-weight: 700;
      font-size: 0.94rem;
    }

    #admin-link[hidden] { display: none; }

    .wip {
      display: inline-block;
      margin-left: 10px;
      padding: 4px 12px;
      border-radius: 999px;
      background: var(--warning);
      color: #92400e;
      font-family: "Source Sans Pro", "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 0.7rem;
      font-weight: 900;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      vertical-align: middle;
      white-space: nowrap;
    }

    :root[data-theme="dark"] .wip { color: #fcd34d; }
</style>
